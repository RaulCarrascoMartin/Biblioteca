spring:
  application:
    name: biblioteca
  autoconfigure:
    # No hay usuario en memoria: la autenticación la hace AuthService con PasswordHasher
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/biblioteca}
    username: ${DB_USERNAME:biblioteca_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # BD preexistente (creada antes de Flyway): se toma como V1 y no se reejecuta el esquema base.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  error:
    include-stacktrace: never
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET}
  # Acceso de vida corta (15 min); el refresh opaco dura 14 días y se guarda hasheado
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}
  issuer: biblioteca-api
  audience: biblioteca-web

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}