spring:
  application:
    name: biblioteca
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/biblioteca}
    username: ${DB_USERNAME:biblioteca_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  error:
    include-stacktrace: never
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:1800000}
  issuer: biblioteca-api
  audience: biblioteca-web

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}